<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHF{% block title %}{% endblock %}</title>
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Design tokens ── */
:root{
  --bg:#0d1117;
  --surface:#161b22;
  --surface2:#1c2128;
  --surface3:#21262d;
  --border:#30363d;
  --border2:#3d444d;
  --text:#e6edf3;
  --text2:#cdd9e5;
  --muted:#768390;
  --accent:#f0b429;
  --accent-dim:#9e7c1c;
  --radius:8px;
}

/* ── Base ── */
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;font-size:inherit}

/* ── Nav ── */
.nav{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  height:54px;
  display:flex;
  align-items:center;
  gap:28px;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:100;
}
.nav-brand{
  font-size:20px;
  font-weight:900;
  color:var(--accent);
  letter-spacing:-1px;
  display:flex;
  align-items:center;
  gap:6px;
}
.nav-brand span{color:var(--text2);font-weight:400;font-size:16px}
.nav-divider{width:1px;height:20px;background:var(--border)}
.nav-link{
  color:var(--muted);
  font-size:13px;
  font-weight:500;
  padding:4px 2px;
  border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;
}
.nav-link:hover{color:var(--text2)}
.nav-link.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── Page wrapper ── */
.page{max-width:1700px;margin:0 auto;padding:24px 20px}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}

{% block style %}{% endblock %}
</style>
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="/"><span>⛸</span> PHF <span>Grades</span></a>
  <div class="nav-divider"></div>
  <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">Season</a>
  <a class="nav-link {% if request.endpoint == 'game_lookup' %}active{% endif %}" href="/game-lookup">Game Lookup</a>
</nav>
<div class="page">
{% block content %}{% endblock %}
</div>
</body>
</html>
