<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>PHG{% block title %}{% endblock %}</title>
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Design tokens ── */
:root{
  --bg:#0d1117;
  --surface:#161b22;
  --surface2:#1c2128;
  --surface3:#21262d;
  --border:#30363d;
  --border2:#3d444d;
  --text:#e6edf3;
  --text2:#cdd9e5;
  --muted:#768390;
  --accent:#f0b429;
  --accent-dim:#9e7c1c;
  --radius:8px;
}

/* ── Base ── */
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;font-size:inherit}

/* ── Nav ── */
.nav{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  height:54px;
  display:flex;
  align-items:center;
  gap:28px;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:100;
}
.nav-brand{
  font-size:20px;
  font-weight:900;
  color:var(--accent);
  letter-spacing:-1px;
  display:flex;
  align-items:center;
  gap:6px;
}
.nav-brand span{color:var(--text2);font-weight:400;font-size:16px}
.nav-divider{width:1px;height:20px;background:var(--border)}
.nav-link{
  color:var(--muted);
  font-size:13px;
  font-weight:500;
  padding:4px 2px;
  border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;
  white-space:nowrap;
}
.nav-link:hover{color:var(--text2)}
.nav-link.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-links{display:flex;align-items:center;gap:28px}
.nav-hamburger{display:none;margin-left:auto;background:none;border:none;padding:6px;color:var(--muted);cursor:pointer}
.nav-dropdown{
  display:none;
  position:absolute;
  top:54px;left:0;right:0;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-direction:column;
  z-index:99;
}
.nav-dropdown.open{display:flex}
.nav-dropdown .nav-link{
  padding:14px 24px;
  border-bottom:1px solid var(--border);
  font-size:14px;
}
.nav-dropdown .nav-link:last-child{border-bottom:none}
@media(max-width:600px){
  .nav-links{display:none}
  .nav-divider{display:none}
  .nav-hamburger{display:block}
  .nav{justify-content:center}
  .nav-brand{position:absolute;left:50%;transform:translateX(-50%)}
  .nav-hamburger{position:absolute;right:16px}
}

/* ── Page wrapper ── */
.page{max-width:1700px;margin:0 auto;padding:24px 20px}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}

{% block style %}{% endblock %}
</style>
</head>
<body>
<nav class="nav" style="position:relative">
  <a class="nav-brand" href="/"><img src="/static/logo.png" alt="PHG" style="height:40px;width:auto;display:block;"></a>
  <div class="nav-divider"></div>
  <div class="nav-links">
    <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">Regular Season</a>
    <a class="nav-link {% if request.endpoint == 'playoffs' %}active{% endif %}" href="/playoffs">Playoffs</a>
    <a class="nav-link {% if request.endpoint == 'game_lookup' %}active{% endif %}" href="/game-lookup">Game Lookup</a>
    <a class="nav-link {% if request.endpoint == 'methodology' %}active{% endif %}" href="/methodology">Methodology</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="19" y2="6"/><line x1="3" y1="11" x2="19" y2="11"/><line x1="3" y1="16" x2="19" y2="16"/></svg>
  </button>
  <div class="nav-dropdown" id="nav-dropdown">
    <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">Regular Season</a>
    <a class="nav-link {% if request.endpoint == 'playoffs' %}active{% endif %}" href="/playoffs">Playoffs</a>
    <a class="nav-link {% if request.endpoint == 'game_lookup' %}active{% endif %}" href="/game-lookup">Game Lookup</a>
    <a class="nav-link {% if request.endpoint == 'methodology' %}active{% endif %}" href="/methodology">Methodology</a>
  </div>
</nav>
<script>
  document.getElementById('nav-hamburger').addEventListener('click', function() {
    document.getElementById('nav-dropdown').classList.toggle('open');
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.nav')) document.getElementById('nav-dropdown').classList.remove('open');
  });
</script>
<div class="page">
{% block content %}{% endblock %}
</div>
<footer style="border-top:1px solid var(--border);margin-top:48px;padding:20px 24px;text-align:center;font-size:11px;color:var(--muted);line-height:1.8;">
  <div>Data: <a href="https://www.naturalstattrick.com" target="_blank" rel="noopener" style="color:var(--muted);text-decoration:underline;text-underline-offset:2px;">Natural Stat Trick</a> · <a href="https://moneypuck.com" target="_blank" rel="noopener" style="color:var(--muted);text-decoration:underline;text-underline-offset:2px;">MoneyPuck</a> · <a href="https://www.allthreezones.com" target="_blank" rel="noopener" style="color:var(--muted);text-decoration:underline;text-underline-offset:2px;">All Three Zones</a></div>
  <div>© 2026 Pro Hockey Grades. All rights reserved.</div>
</footer>
</body>
</html>
